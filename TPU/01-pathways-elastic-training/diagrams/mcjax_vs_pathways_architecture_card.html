  <script>
    let scale = 1, panX = 0, panY = 0, isDragging = false, startX = 0, startY = 0;
    const svgEl = document.getElementById('diagram-svg');
    const canvasEl = document.getElementById('dendrite-canvas');
    const staticEl = document.getElementById('static-container');
    staticEl.innerHTML = svgEl.outerHTML;
    function updateTransform() { svgEl.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`; }
    function zoom(f) { scale = Math.min(2.5, Math.max(0.5, scale * f)); updateTransform(); }
    function resetZoom() { scale = 1; panX = 0; panY = 0; updateTransform(); }
    canvasEl.addEventListener('mousedown', (e) => { isDragging = true; startX = e.clientX - panX; startY = e.clientY - panY; });
    window.addEventListener('mousemove', (e) => { if (!isDragging) return; panX = e.clientX - startX; panY = e.clientY - startY; updateTransform(); });
    window.addEventListener('mouseup', () => { isDragging = false; });
    canvasEl.addEventListener('wheel', (e) => { e.preventDefault(); zoom(e.deltaY < 0 ? 1.08 : 0.92); }, { passive: false });
    function setView(mode) {
      document.getElementById('btn-interactive').classList.toggle('active', mode === 'interactive');
      document.getElementById('btn-static').classList.toggle('active', mode === 'static');
      canvasEl.style.display = mode === 'interactive' ? 'flex' : 'none';
      document.getElementById('zoom-bar').style.display = mode === 'interactive' ? 'flex' : 'none';
      staticEl.style.display = mode === 'static' ? 'flex' : 'none';
    }
    function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }
    function copyDSL() { navigator.clipboard.writeText(document.getElementById('dendrite-dsl').textContent); showToast('Dendrite DSL copied!'); }
    function copySVG() { navigator.clipboard.writeText(svgEl.outerHTML); showToast('SVG copied!'); }
    function copyHDPNG() {
      const svgData = new XMLSerializer().serializeToString(svgEl);
      const img = new Image();
      const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      img.onload = function() {
        const c = document.createElement('canvas'); c.width = 2480; c.height = 1120;
        const ctx = c.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        c.toBlob(async (pngBlob) => {
          try {
            await navigator.clipboard.write([new ClipboardItem({ 'image/png': pngBlob })]);
            showToast('2x Retina HD PNG copied! Press Ctrl+V / Cmd+V in Google Doc');
          } catch (err) {
            const a = document.createElement('a'); a.download = 'mcjax_vs_pathways_architecture.png'; a.href = c.toDataURL('image/png'); a.click();
