<svg id="diagram-svg" class="bento-svg" viewBox="0 0 1240 560" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
          </marker>
          <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
          </marker>
          <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.07"/>
          </filter>
        </defs>

        <!-- Title Banner -->
        <rect x="16" y="10" width="1208" height="38" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="32" y="34" font-size="14" font-weight="700" fill="#0f172a">Why Large-Scale Synchronous Training Disrupts — And How Google Cloud Pathways Isolates the Blast Radius</text>
        <text x="1208" y="34" font-size="11" font-weight="600" fill="#475569" text-anchor="end">Without Pathways (McJAX) vs. With Pathways</text>

        <!-- COLUMN 1: Operational Disruption Triggers -->
        <rect x="16" y="60" width="268" height="484" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <text x="32" y="84" font-size="11.5" font-weight="700" fill="#1e293b">CLUSTER DISRUPTION TRIGGERS</text>
        <text x="32" y="98" font-size="10" fill="#475569">Routine Day-2 Events in Large AI Clusters</text>

        <g class="node-card" filter="url(#card-shadow)">
          <rect x="32" y="116" width="236" height="68" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
          <text x="150" y="138" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">Scheduled Software &amp; Node Upgrades</text>
          <text x="150" y="154" font-size="10" fill="#1e40af" text-anchor="middle">GKE node OS patches, TPU driver updates,</text>
          <text x="150" y="168" font-size="10" fill="#1e40af" text-anchor="middle">&amp; Kubernetes control-plane maintenance</text>
        </g>

        <g class="node-card" filter="url(#card-shadow)">
          <rect x="32" y="200" width="236" height="68" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
          <text x="150" y="222" font-size="11.5" font-weight="700" fill="#713f12" text-anchor="middle">Spot &amp; DWS Flex Preemptions</text>
          <text x="150" y="238" font-size="10" fill="#854d0e" text-anchor="middle">Dynamic capacity reclamation or higher-</text>
          <text x="150" y="252" font-size="10" fill="#854d0e" text-anchor="middle">priority Kueue workload preemption</text>
        </g>

        <g class="node-card" filter="url(#card-shadow)">
          <rect x="32" y="284" width="236" height="68" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
          <text x="150" y="306" font-size="11.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">Single Host / Link Interruption</text>
          <text x="150" y="322" font-size="10" fill="#991b1b" text-anchor="middle">1 host in Slice 1 goes offline for repair</text>
          <text x="150" y="336" font-size="10" fill="#991b1b" text-anchor="middle">while Peer Slices remain 100% healthy</text>
        </g>

        <g class="node-card" filter="url(#card-shadow)">
          <rect x="32" y="372" width="236" height="152" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
          <text x="150" y="394" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Multi-Host Topology Context</text>
          <text x="150" y="414" font-size="10" fill="#334155" text-anchor="middle">• Any large cluster: 1 host fault aborts</text>
          <text x="150" y="428" font-size="10" fill="#334155" text-anchor="middle">coupled multi-controller jobs.</text>
          <text x="150" y="448" font-size="10" fill="#334155" text-anchor="middle">• TPU v6e: 2D ICI torus temporarily</text>
          <text x="150" y="462" font-size="10" fill="#334155" text-anchor="middle">idles that slice until node replacement.</text>
          <text x="150" y="484" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">• TPU v7x (Ironwood): Supports dynamic</text>
          <text x="150" y="498" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">sub-slice routing resilience.</text>
        </g>

        <!-- TOP LANE: Without Pathways (McJAX) -->
        <rect x="316" y="60" width="600" height="226" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
        <text x="334" y="84" font-size="11.5" font-weight="700" fill="#7f1d1d">WITHOUT PATHWAYS: TRADITIONAL MULTI-CONTROLLER (McJAX)</text>
        <text x="334" y="98" font-size="10" fill="#991b1b">Every TPU host runs a coupled Python process — 1 interrupted host aborts 100% of slices</text>

        <g class="node-card" filter="url(#card-shadow)">
          <rect x="334" y="114" width="266" height="68" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
          <text x="467" y="136" font-size="11.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">1. Global Collective Barrier Timeout</text>
          <text x="467" y="152" font-size="10" fill="#991b1b" text-anchor="middle">1 host drops out → XLA AllReduce hangs →</text>
          <text x="467" y="166" font-size="10" fill="#991b1b" text-anchor="middle">All 127 healthy hosts crash on gRPC abort</text>
        </g>

        <g class="node-card" filter="url(#card-shadow)">
          <rect x="630" y="114" width="268" height="68" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
          <text x="764" y="136" font-size="11.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">2. Full JobSet Pod Teardown</text>
          <text x="764" y="152" font-size="10" fill="#991b1b" text-anchor="middle">GKE terminates &amp; recreates all worker pods</text>
          <text x="764" y="166" font-size="10" fill="#991b1b" text-anchor="middle">Healthy peer slices sit 100% idle waiting</text>
        </g>

        <g class="node-card" filter="url(#card-shadow)">
          <rect x="334" y="198" width="266" height="68" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
          <text x="467" y="220" font-size="11.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">3. Cold Python Boot + XLA Recompile</text>
          <text x="467" y="236" font-size="10" fill="#991b1b" text-anchor="middle">Re-initializes JAX, PyGrain &amp; XLA graph</text>
          <text x="467" y="250" font-size="10" fill="#991b1b" text-anchor="middle">across all slices from scratch</text>
        </g>

        <g class="node-card" filter="url(#card-shadow)">
          <rect x="630" y="198" width="268" height="68" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
          <text x="764" y="220" font-size="11.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">4. Synchronized GCS Restore Storm</text>
          <text x="764" y="236" font-size="10" fill="#991b1b" text-anchor="middle">Every replica slice pulls full weights from</text>
          <text x="764" y="250" font-size="10" fill="#991b1b" text-anchor="middle">GCS simultaneously, spiking network I/O</text>
        </g>

        <!-- BOTTOM LANE: With Pathways Single-Controller -->
        <rect x="316" y="308" width="600" height="236" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
        <text x="334" y="332" font-size="11.5" font-weight="700" fill="#14532d">WITH PATHWAYS: DECOUPLED SINGLE-CONTROLLER ARCHITECTURE</text>
        <text x="334" y="346" font-size="10" fill="#166534">Single CPU coordinator orchestrates TPU slices via IFRT Proxy — zero head pod restarts</text>

        <g class="node-card" filter="url(#card-shadow)">
          <rect x="334" y="364" width="266" height="72" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
          <text x="467" y="386" font-size="11.5" font-weight="700" fill="#14532d" text-anchor="middle">1. Decoupled JAX Head Survives</text>
          <text x="467" y="402" font-size="10" fill="#166534" text-anchor="middle">IFRT Proxy catches slice RPC disconnect;</text>
          <text x="467" y="416" font-size="10" fill="#166534" text-anchor="middle">Python process stays alive (restartCount=0)</text>
          <text x="467" y="430" font-size="9.5" font-weight="700" fill="#15803d" text-anchor="middle">Zero container reboot overhead</text>
        </g>

        <g class="node-card" filter="url(#card-shadow)">
          <rect x="630" y="364" width="268" height="72" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
          <text x="764" y="386" font-size="11.5" font-weight="700" fill="#14532d" text-anchor="middle">2. Resource Manager Isolates Slice</text>
          <text x="764" y="402" font-size="10" fill="#166534" text-anchor="middle">Detects unavailable slice in seconds;</text>
          <text x="764" y="416" font-size="10" fill="#166534" text-anchor="middle">keeps healthy peer slices active over DCN</text>
          <text x="764" y="430" font-size="9.5" font-weight="700" fill="#15803d" text-anchor="middle">Blast radius strictly capped to 1 slice</text>
        </g>

        <g class="node-card" filter="url(#card-shadow)">
          <rect x="334" y="452" width="266" height="72" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
          <text x="467" y="474" font-size="11.5" font-weight="700" fill="#14532d" text-anchor="middle">3. Option 1 (Resize) or Option 2 (Pause)</text>
          <text x="467" y="490" font-size="10" fill="#166534" text-anchor="middle">Resizes live to N-1 slices OR pauses</text>
          <text x="467" y="504" font-size="10" fill="#166534" text-anchor="middle">in-memory while Kueue backfills slices</text>
          <text x="467" y="518" font-size="9.5" font-weight="700" fill="#15803d" text-anchor="middle">Warm XLA cache · Fast reconfiguration</text>
        </g>

        <g class="node-card" filter="url(#card-shadow)">
          <rect x="630" y="452" width="268" height="72" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
          <text x="764" y="474" font-size="11.5" font-weight="700" fill="#14532d" text-anchor="middle">4. Seamless Return to N Slices</text>
          <text x="764" y="490" font-size="10" fill="#166534" text-anchor="middle">Replaced node rejoins automatically;</text>
          <text x="764" y="504" font-size="10" fill="#166534" text-anchor="middle">weights broadcast over Megascale DCN</text>
          <text x="764" y="518" font-size="9.5" font-weight="700" fill="#15803d" text-anchor="middle">Automatic return to 100% peak throughput</text>
        </g>

        <!-- COLUMN 4: Business & Engineering Impact -->
        <rect x="948" y="60" width="276" height="484" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
        <text x="964" y="84" font-size="11.5" font-weight="700" fill="#1e3a8a">BUSINESS &amp; ENGINEERING IMPACT</text>
        <text x="964" y="98" font-size="10" fill="#1d4ed8">Measured Multi-Slice Production Gains</text>

        <g class="node-card" filter="url(#card-shadow)">
          <rect x="964" y="120" width="244" height="126" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
          <text x="1086" y="144" font-size="12" font-weight="700" fill="#7f1d1d" text-anchor="middle">Baseline (Without Pathways)</text>
          <text x="1086" y="166" font-size="10.5" fill="#991b1b" text-anchor="middle">• 100% cluster idle during single-host</text>
          <text x="1086" y="182" font-size="10.5" fill="#991b1b" text-anchor="middle">upgrade or Spot preemption</text>
          <text x="1086" y="202" font-size="10.5" fill="#991b1b" text-anchor="middle">• Full cold pod boot + recompilation</text>
          <text x="1086" y="222" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="middle">• Delayed model release milestones</text>
        </g>

        <g class="node-card" filter="url(#card-shadow)">
          <rect x="964" y="330" width="244" height="190" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
          <text x="1086" y="356" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle">With Pathways Elasticity</text>
          <text x="1086" y="380" font-size="11.5" font-weight="700" fill="#166534" text-anchor="middle">• 53% Faster Recovery Time</text>
          <text x="1086" y="402" font-size="11.5" font-weight="700" fill="#166534" text-anchor="middle">• +42% Effective Cluster Goodput</text>
          <text x="1086" y="424" font-size="11.5" font-weight="700" fill="#166534" text-anchor="middle">• 50% Lower GCS Read Egress</text>
          <text x="1086" y="450" font-size="10" fill="#15803d" text-anchor="middle">• Zero-downtime GKE OS/driver upgrades</text>
          <text x="1086" y="468" font-size="10" fill="#15803d" text-anchor="middle">• Resilient Spot / DWS Flex adoption</text>
          <text x="1086" y="486" font-size="10" fill="#15803d" text-anchor="middle">• Zero manual on-call intervention</text>
          <text x="1086" y="506" font-size="10" font-weight="700" fill="#14532d" text-anchor="middle">Predictable capital efficiency &amp; SLAs</text>
        </g>

        <!-- Connectors -->
        <path d="M 268 234 L 296 234 L 296 148 L 328 148" fill="none" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow-red)"/>
        <path d="M 268 318 L 296 318 L 296 400 L 328 400" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
        <path d="M 600 148 L 624 148" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
        <path d="M 600 232 L 624 232" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
        <path d="M 600 400 L 624 400" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
        <path d="M 600 488 L 624 488" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
        <path d="M 898 185 L 958 185" fill="none" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow-red)"/>
        <path d="M 898 435 L 958 435" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
      </svg>